# Release workflow — fires on any `v*` tag push.
#
# Jobs:
#   test          — gate. pnpm build + pnpm test + pnpm typecheck (same trio
#                   as .github/workflows/ci.yml).
#   publish-npm   — needs: test. Verifies the tag's version matches
#                   packages/core/package.json, derives an npm dist-tag from
#                   the prerelease suffix, and runs `pnpm -r publish`.
#   deploy-docker — needs: test. Builds docs-site/Dockerfile, pushes to
#                   GitHub Container Registry (ghcr.io), rolls the Swarm
#                   service `l5e_docs` via `docker service update`, then
#                   purges the Cloudflare `global` cache tag.
#
# Required secrets (GitHub repo → Settings → Secrets and variables → Actions):
#
#   NPM_TOKEN              npm.com automation token, publish scope on @withl5e/*
#   VPS_HOST               Public IP or domain of the Swarm manager
#   VPS_USER               SSH user on the manager
#   VPS_SSH_KEY            Private key whose public half is in VPS authorized_keys
#   VPS_PORT               (optional) SSH port if not 22
#   CF_ZONE_ID             Cloudflare Zone ID (Overview tab of the zone)
#   CF_TOKEN               Cloudflare API token with `Zone.Cache Purge` permission
#
# Note: ghcr.io auth uses the auto-provided GITHUB_TOKEN — no secret needed.
# The deploy-docker job declares `permissions: packages: write` for this.

name: Release

on:
  push:
    tags: ['v*']

# Allow only one release per tag at a time so the registry / VPS don't
# end up racing two concurrent pushes of the same image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Test gate — release jobs only run if this finishes green.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the `packageManager` field in package.json
      # (pnpm@11.0.9). Don't pass `version:` here — action errors with
      # ERR_PNPM_BAD_PM_VERSION when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

  # ─────────────────────────────────────────────────────────────────────
  # Publish all workspace packages to npm.
  # ─────────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json
      # (pnpm@11.0.9). Don't pass `version:` here — action errors with
      # ERR_PNPM_BAD_PM_VERSION when both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions, resolve dist-tag
        id: tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const tag = process.env.GITHUB_REF_NAME;          // e.g. v0.1.2-alpha.0
          const expected = tag.replace(/^v/, '');
          const pkgs = [
            'packages/core/package.json',
            'packages/richtext-payload/package.json',
            'packages/create-l5e/package.json',
          ];

          const versions = pkgs.map((p) => {
            const v = JSON.parse(fs.readFileSync(p, 'utf8')).version;
            console.log(`  ${p} → ${v}`);
            return { p, v };
          });

          const mismatches = versions.filter((x) => x.v !== expected);
          if (mismatches.length > 0) {
            console.error(`\n❌ Tag ${tag} (expected ${expected}) does not match:`);
            mismatches.forEach((m) => console.error(`     ${m.p} = ${m.v}`));
            process.exit(1);
          }

          // Pick npm dist-tag from prerelease suffix.
          //   <x>-alpha.N  → alpha
          //   <x>-beta.N   → beta
          //   <x>-rc.N     → next
          //   <x> (no suffix) → latest
          let dist = 'latest';
          const m = expected.match(/-(alpha|beta|rc)(?:\.|$)/i);
          if (m) {
            const label = m[1].toLowerCase();
            dist = label === 'rc' ? 'next' : label;
          }

          console.log(`\n✓ Versions all match ${expected}`);
          console.log(`✓ Dist-tag: ${dist}`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist=${dist}\nversion=${expected}\n`);
          NODE

      - run: pnpm -r build

      - name: Publish (pnpm -r publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm -r publish \
            --no-git-checks \
            --access public \
            --tag "${{ steps.tag.outputs.dist }}"

  # ─────────────────────────────────────────────────────────────────────
  # Build docs-site image, push to GitHub Container Registry, deploy.
  # ─────────────────────────────────────────────────────────────────────
  deploy-docker:
    name: Build & deploy docs image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # Image name must be lowercase for ghcr.io. github.repository can mix
      # case (e.g. "withl5e/L5E") so we lowercase it here.
      - name: Resolve image tags
        id: img
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"      >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-site/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rolls the existing Swarm service `l5e_docs` onto the new image.
      # --with-registry-auth forwards the manager's registry creds to workers
      # (the manager must `docker login ghcr.io` once during bootstrap).
      # --force re-deploys even when only the digest behind :latest changed.
      - name: Roll Swarm service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            docker service update \
              --image ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }} \
              --with-registry-auth \
              --force \
              l5e_docs

      # Purge the Cloudflare cache tagged `global` so visitors see the new
      # docs build immediately. Mirrors the endfield pattern. Requires the
      # docs to emit a `Cache-Tag: global` response header at the edge.
      - name: Purge Cloudflare cache (tag=global)
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"tags":["global"]}'
